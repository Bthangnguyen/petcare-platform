name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck and API tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    name: Frontend (typecheck and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  dist-guard:
    name: frontend/dist is built by the project manager only
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A pull request must not change frontend/dist
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^frontend/dist/'; then
            echo "This pull request changes frontend/dist. Remove those files (git checkout origin/${{ github.base_ref }} -- frontend/dist); the project manager rebuilds dist at each milestone."
            exit 1
          fi
